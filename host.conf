# This stores often used information on this build system

local_snapshots=/home/rob/projects/gnu/abe.git/master/snapshots
git_reference_dir=
remote_snapshots=
abe_top=/home/rob/projects/gnu/abe.git/master
abe_path=/home/rob/projects/gnu/abe.git/master

sources_conf=/home/rob/projects/gnu/abe.git/master/config/sources.conf

# This is where the components we build go, ie... make install
local_builds=/home/rob/projects/gnu/abe.git/master/builds

# This is a sysroot to a pre-compiled C library
sysroots=/home/rob/projects/gnu/abe.git/master/sysroots

# config values for the build machine
cpus=20
kernel=5.19.0-23-generic
build_arch=x86_64
build=x86_64-unknown-linux-gnu
hostname=nomad.moongulch.net
distribution=kinetic

# various configure time flags
with_languages=default
enable_ssh=no
alltests=no
install=yes
make_docs=yes
supdate=yes
parallel=yes

wget_bin=/usr/bin/wget
bash_shell=/bin/bash
NEWWORKDIR=/usr/local/bin/git-new-workdir
